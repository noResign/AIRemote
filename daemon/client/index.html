<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>paboot 测试客户端</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 900px; margin: 2rem auto; padding: 0 1rem; color: #111; }
  h1 { font-size: 1.3rem; }
  label { display: block; font-size: .8rem; color: #555; margin: .7rem 0 .2rem; }
  input, textarea { width: 100%; box-sizing: border-box; padding: .5rem; font: inherit; border: 1px solid #ccc; border-radius: 6px; }
  textarea { min-height: 4rem; resize: vertical; }
  button { margin-top: .8rem; padding: .5rem 1.1rem; font: inherit; cursor: pointer; border: 1px solid #ccc; border-radius: 6px; background: #f5f5f5; }
  button#send { background: #111; color: #fff; border-color: #111; }
  #log { background: #0f172a; color: #e2e8f0; padding: 1rem; border-radius: 8px; white-space: pre-wrap; word-break: break-word; min-height: 14rem; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: .85rem; line-height: 1.5; margin-top: 1rem; }
  .meta { color: #94a3b8; }
  .tool { color: #7dd3fc; }
  .perm { color: #fbbf24; }
  .err { color: #f87171; }
</style>
</head>
<body>
<h1>paboot 测试客户端</h1>

<label>daemon 地址</label>
<input id="base" value="http://127.0.0.1:4780">

<label>token（终端里 <code>cat ~/.paboot/token</code> 获取）</label>
<input id="token" type="password" placeholder="粘贴 token">

<label>prompt</label>
<textarea id="prompt">list the files in the current directory, then run one shell command and report the result</textarea>

<label>sessionId（可选，续接 paboot 会话；留空则新建）</label>
<input id="sessionId" placeholder="留空 = 新会话">

<label>续接本机 Claude 会话（电脑 TUI 里开的）</label>
<div style="display:flex; gap:8px; align-items:stretch;">
  <select id="claudeSession" style="flex:1; padding:.5rem; border:1px solid #ccc; border-radius:6px; font:inherit;">
    <option value="">（不续接）</option>
  </select>
  <button id="loadSessions" type="button" style="margin-top:0;">加载本机会话</button>
</div>

<div>
  <button id="send">发送</button>
  <button id="cancel" disabled>取消当前 run</button>
  <button id="newSession" type="button">新会话</button>
</div>

<div id="log"></div>

<div id="permModal" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,.5); z-index:10; align-items:center; justify-content:center;">
  <div style="background:#fff; padding:1.2rem; border-radius:10px; max-width:520px; width:92%;">
    <div style="font-weight:600; margin-bottom:.5rem;">允许执行工具「<span id="permTool"></span>」吗？</div>
    <pre id="permInput" style="background:#f1f5f9; padding:.6rem; border-radius:6px; white-space:pre-wrap; word-break:break-word; max-height:220px; overflow:auto; font-size:.8rem; margin:0 0 .8rem;"></pre>
    <div style="display:flex; gap:8px; justify-content:flex-end;">
      <button id="permDeny" type="button">拒绝</button>
      <button id="permAllowAll" type="button">允许全部</button>
      <button id="permAllow" type="button" style="background:#111;color:#fff;border-color:#111;">允许</button>
    </div>
  </div>
</div>

<script>
const $ = (id) => document.getElementById(id);
const log = $('log');
let currentRunId = null;
let currentSessionId = null;

function out(text, cls) {
  const span = document.createElement('span');
  if (cls) span.className = cls;
  span.textContent = text;
  log.appendChild(span);
  log.scrollTop = log.scrollHeight;
}

async function decide(permissionId, decision, reason) {
  try {
    await fetch(`${$('base').value}/api/permissions/${permissionId}/decision`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${$('token').value}` },
      body: JSON.stringify({ decision, reason }),
    });
  } catch (e) {
    out(`\n[decision 发送失败: ${e}]\n`, 'err');
  }
}

let permResolve = null;
function showPermission(ev) {
  $('permTool').textContent = ev.toolName;
  $('permInput').textContent = JSON.stringify(ev.toolInput, null, 2);
  $('permAllowAll').textContent = `允许全部 ${ev.toolName}`;
  $('permModal').style.display = 'flex';
  return new Promise((resolve) => { permResolve = resolve; });
}
function answerPermission(decision, reason) {
  $('permModal').style.display = 'none';
  if (permResolve) { permResolve({ decision, reason }); permResolve = null; }
}
$('permAllow').onclick = () => answerPermission('allow');
$('permDeny').onclick = () => answerPermission('deny', '用户拒绝');
$('permAllowAll').onclick = () => answerPermission('allow_all');

async function loadSessions() {
  const sel = $('claudeSession');
  const base = $('base').value.trim().replace(/\/$/, '');
  const token = $('token').value.trim();
  sel.innerHTML = '<option value="">加载中…</option>';
  try {
    const res = await fetch(`${base}/api/claude-sessions`, {
      headers: { Authorization: `Bearer ${token}` },
    });
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const data = await res.json();
    const sessions = data.sessions || [];
    sel.innerHTML = '<option value="">（不续接）</option>';
    for (const s of sessions) {
      const opt = document.createElement('option');
      opt.value = s.sessionId;
      const summary = s.summary ? s.summary.replace(/\s+/g, ' ').slice(0, 40) : '无摘要';
      opt.textContent = `${s.cwd} · ${s.messageCount}条 · ${summary}`;
      sel.appendChild(opt);
    }
    out(`\n[已加载 ${sessions.length} 个本机会话]\n`, 'meta');
  } catch (e) {
    sel.innerHTML = '<option value="">加载失败</option>';
    out(`\n[加载本机会话失败: ${e}]\n`, 'err');
  }
}
$('loadSessions').onclick = loadSessions;
$('newSession').onclick = () => {
  currentSessionId = null;
  $('sessionId').value = '';
  $('sessionId').placeholder = '留空 = 新会话';
  out('\n[已开始新会话]\n', 'meta');
};

$('send').onclick = async () => {
  const base = $('base').value.trim().replace(/\/$/, '');
  const token = $('token').value.trim();
  const prompt = $('prompt').value;
  const manualSessionId = $('sessionId').value.trim() || undefined;
  const sessionId = manualSessionId || currentSessionId || undefined;
  if (!token || !prompt) { out('请填写 token 和 prompt\n', 'err'); return; }

  log.textContent = '';
  currentRunId = null;
  $('cancel').disabled = false;

  const claudeSessionId = $('claudeSession').value.trim() || undefined;
  const body = { prompt };
  if (claudeSessionId) body.claudeSessionId = claudeSessionId;
  else if (sessionId) body.sessionId = sessionId;

  let res;
  try {
    res = await fetch(`${base}/api/chat`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${token}` },
      body: JSON.stringify(body),
    });
  } catch (e) {
    out(`连接失败: ${e}\n`, 'err');
    $('cancel').disabled = true;
    return;
  }

  if (!res.ok || !res.body) {
    out(`请求失败: HTTP ${res.status} ${await res.text().catch(() => '')}\n`, 'err');
    $('cancel').disabled = true;
    return;
  }

  const reader = res.body.getReader();
  const decoder = new TextDecoder();
  let buf = '';

  const handleEvent = async (frame) => {
    const { runId, event: ev } = frame;
    currentRunId = runId;
    switch (ev.type) {
      case 'status':
        if (ev.sessionId && !currentSessionId) {
          currentSessionId = ev.sessionId;
          $('sessionId').placeholder = `已记住会话 ${ev.sessionId.slice(0, 8)}…（自动续接）`;
        }
        out(`\n[${ev.label}${ev.terminal ? ' · 结束' : ''}]\n`, 'meta');
        break;
      case 'text_delta':
        out(ev.delta, '');
        break;
      case 'thinking_delta':
        out(ev.delta, 'meta');
        break;
      case 'tool_use':
        out(`\n🛠 ${ev.name} ${JSON.stringify(ev.input)}\n`, 'tool');
        break;
      case 'tool_result':
        out(`  ↳ ${ev.isError ? '❌' : '✅'} ${String(ev.content).slice(0, 400)}\n`, ev.isError ? 'err' : 'tool');
        break;
      case 'permission_request': {
        const choice = await showPermission(ev);
        await decide(ev.permissionId, choice.decision, choice.reason);
        out(`\n🔒 权限请求 ${ev.toolName} → ${choice.decision}\n`, 'perm');
        break;
      }
      case 'error':
        out(`\n❌ [${ev.code ?? 'error'}] ${ev.message}\n`, 'err');
        break;
      case 'turn_end':
        out(`\n[turn_end: ${ev.stopReason}]\n`, 'meta');
        break;
      default:
        break;
    }
  };

  try {
    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buf += decoder.decode(value, { stream: true });
      let idx;
      while ((idx = buf.indexOf('\n\n')) >= 0) {
        const frame = buf.slice(0, idx);
        buf = buf.slice(idx + 2);
        for (const line of frame.split('\n')) {
          if (!line.startsWith('data: ')) continue;
          try {
            await handleEvent(JSON.parse(line.slice(6)));
          } catch (e) {
            out(`\n[解析失败: ${e}]\n`, 'err');
          }
        }
      }
    }
    buf += decoder.decode();
    out('\n[流结束]\n', 'meta');
  } catch (e) {
    out(`\n[读取中断: ${e}]\n`, 'err');
  } finally {
    $('cancel').disabled = true;
  }
};

$('cancel').onclick = async () => {
  if (!currentRunId) return;
  try {
    await fetch(`${$('base').value}/api/runs/${currentRunId}/cancel`, {
      method: 'POST',
      headers: { Authorization: `Bearer ${$('token').value}` },
    });
    out('\n[已请求取消]\n', 'meta');
  } catch (e) {
    out(`\n[取消失败: ${e}]\n`, 'err');
  }
};
</script>
</body>
</html>
