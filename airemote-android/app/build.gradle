plugins {
    alias(libs.plugins.android.application)
    alias(libs.plugins.kotlin.android)
    alias(libs.plugins.kotlin.compose)
    // 不再需要 kotlin-serialization 插件：本模块已无 @Serializable 类，协议 DTO 都在 :lib-network
}

def keystorePropertiesFile = rootProject.file("keystore.properties")
def keystoreProperties = new Properties()
def hasKeystore = keystorePropertiesFile.exists()
if (hasKeystore) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

// 未显式指定 versionCode 时，本地构建（包括 Android Studio Run 的 debug）用 epoch 秒，
// 保证 debug 与 release 交替安装时 versionCode 单调递增，避免 INSTALL_FAILED_VERSION_DOWNGRADE。
def rawVersionCode = project.findProperty("versionCode")?.toString()
def versionCodeOverride = rawVersionCode
        ? rawVersionCode.toInteger()
        : (System.currentTimeMillis().intdiv(1000L)) as int
def versionNameOverride = project.findProperty("versionName")?.toString()

android {
    namespace 'com.airemote.airemote'
    compileSdk 36

    defaultConfig {
        applicationId "com.airemote.airemote"
        minSdk 24
        targetSdk 36
        versionCode versionCodeOverride
        versionName versionNameOverride ?: "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    signingConfigs {
        if (hasKeystore) {
            release {
                storeFile file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
            }
        }
    }

    buildTypes {
        debug {
            // Android Studio Run 安装的 debug 包与 release 包共用同一个签名，
            // 这样“Run 安装”和“应用内自动更新安装”可以互相覆盖，不会签名冲突。
            if (hasKeystore) {
                signingConfig signingConfigs.release
            }
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (hasKeystore) {
                signingConfig signingConfigs.release
            }
        }
    }

    flavorDimensions += "channel"
    productFlavors {
        alpha {
            dimension "channel"
            applicationIdSuffix ".alpha"
            versionNameSuffix "-alpha"
            buildConfigField "String", "UPDATE_CHANNEL", "\"alpha\""
            buildConfigField "String", "UPDATE_MANIFEST_URL", "\"https://your-bucket.oss-cn-hangzhou.aliyuncs.com/android/alpha/manifest.json\""
        }
        prod {
            dimension "channel"
            buildConfigField "String", "UPDATE_CHANNEL", "\"prod\""
            buildConfigField "String", "UPDATE_MANIFEST_URL", "\"https://your-bucket.oss-cn-hangzhou.aliyuncs.com/android/prod/manifest.json\""
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    buildFeatures {
        compose true
        buildConfig true
    }
}

dependencies {
    // 全部网络能力（Retrofit/OkHttp/coroutines/kotlinx-serialization 依赖 + 协议 DTO + API + SSE）
    // 都由 :lib-network 以 api 暴露，本模块直接用，不重复声明
    implementation project(':lib-network')
    implementation project(':lib-updater')

    implementation libs.androidx.core.ktx
    implementation libs.androidx.lifecycle.runtime.ktx
    implementation libs.androidx.lifecycle.runtime.compose
    implementation libs.androidx.activity.compose
    implementation platform(libs.androidx.compose.bom)

    implementation libs.androidx.navigation.compose
    implementation libs.mmkv

    implementation libs.androidx.compose.ui
    implementation libs.androidx.compose.ui.graphics
    implementation libs.androidx.compose.ui.tooling.preview
    implementation libs.androidx.compose.material3
    implementation libs.androidx.compose.material.icons.extended
    testImplementation libs.junit
    androidTestImplementation libs.androidx.junit
    androidTestImplementation libs.androidx.espresso.core
    androidTestImplementation platform(libs.androidx.compose.bom)
    androidTestImplementation libs.androidx.compose.ui.test.junit4
    debugImplementation libs.androidx.compose.ui.tooling
    debugImplementation libs.androidx.compose.ui.test.manifest
}