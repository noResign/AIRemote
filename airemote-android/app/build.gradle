def keystorePropertiesFile = rootProject.file("keystore.properties")
def keystoreProperties = new Properties()
def hasKeystore = keystorePropertiesFile.exists()
if (hasKeystore) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

// 版本号约定（与 release-android.sh 配套，见 docs/updater.md §7.1）：
//   正式包（release variant）：versionCode = epoch 秒，versionName = version.txt 的语义化版本
//           （alpha 追加 -alpha.<时间戳>，保证同一版本多次 alpha 也升序）
//   本地包（debug variant）：versionCode = 1（固定低值），versionName = 0.0.0-<yyyyMMddHHmmss>
// release-android.sh 通过 -PversionCode/-PversionName 注入时优先级最高。
// 两个字段都必须「正式包 > 本地包」：ColorOS 安装器会拿 versionName 比大小，
// 但 Android 安装器首先按 versionCode 判降级；本地用 epoch 时，只要本地构建晚于
// 正式包，安装器就会报「已安装更高版本」。本地固定 1 才能保证正式包永远可覆盖安装。
def rawVersionCode = project.findProperty("versionCode")?.toString()
def versionCodeOverride = rawVersionCode
        ? rawVersionCode.toInteger()
        : 1
def versionNameOverride = project.findProperty("versionName")?.toString()
def utcTimestamp = {
    def fmt = new java.text.SimpleDateFormat("yyyyMMddHHmmss")
    fmt.timeZone = TimeZone.getTimeZone("UTC")
    fmt.format(new Date())
}
def localVersionName = "0.0.0-" + utcTimestamp()
// 正式版本号源；release variant 会自动读取，不再要求必须由 release-android.sh 注入 -P。
def versionFile = rootProject.file("version.txt")

// 应用内更新通道 URL 不入库：从 updater.properties（gitignored，模板见 updater.properties.example）
// 读取，缺失则为空串 —— 构建出的包没有更新通道，设置页自动隐藏「检查更新」入口。
// 支持 -P<key>=... 覆盖（优先级更高），发布脚本据此注入。
def updaterPropertiesFile = rootProject.file("updater.properties")
def updaterProperties = new Properties()
if (updaterPropertiesFile.exists()) {
    updaterPropertiesFile.withInputStream { updaterProperties.load(it) }
}
def updaterUrl = { String key ->
    def fromFlag = project.findProperty(key)?.toString()?.trim()
    def fromFile = updaterProperties.getProperty(key)?.trim()
    fromFlag ?: fromFile ?: ""
}

android {
    namespace 'com.airemote.airemote'
    compileSdk 36

    defaultConfig {
        applicationId "com.airemote.airemote"
        minSdk 24
        targetSdk 36
        versionCode versionCodeOverride
        versionName versionNameOverride ?: localVersionName

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    signingConfigs {
        if (hasKeystore) {
            release {
                storeFile file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
            }
        }
    }

    buildTypes {
        debug {
            // Android Studio Run 安装的 debug 包与 release 包共用同一个签名，
            // 这样“Run 安装”和“应用内自动更新安装”可以互相覆盖，不会签名冲突。
            if (hasKeystore) {
                signingConfig signingConfigs.release
            }
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (hasKeystore) {
                signingConfig signingConfigs.release
            }
        }
    }

    flavorDimensions += "channel"
    productFlavors {
        alpha {
            dimension "channel"
            applicationIdSuffix ".alpha"
            buildConfigField "String", "UPDATE_CHANNEL", "\"alpha\""
            buildConfigField "String", "UPDATE_MANIFEST_URL", "\"${updaterUrl('alphaManifestUrl')}\""
        }
        prod {
            dimension "channel"
            buildConfigField "String", "UPDATE_CHANNEL", "\"prod\""
            buildConfigField "String", "UPDATE_MANIFEST_URL", "\"${updaterUrl('prodManifestUrl')}\""
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    buildFeatures {
        compose true
        buildConfig true
    }
}

// release variant 默认按正式包处理：versionCode = epoch 秒，versionName = version.txt
// （alpha release 追加 -alpha.<UTC 时间戳>）。debug 仍是本地包：code=1、name=0.0.0-*。
// release-android.sh 通过 -PversionCode/-PversionName 注入时优先级更高。
androidComponents {
    onVariants(selector().all()) { variant ->
        if (variant.buildType != "release") return
        def releaseVersionCode = rawVersionCode
                ? rawVersionCode.toInteger()
                : (System.currentTimeMillis().intdiv(1000L)) as int
        def releaseVersionName = versionNameOverride
        if (!releaseVersionName) {
            if (!versionFile.exists()) {
                throw new GradleException("missing version file: ${versionFile}")
            }
            def base = versionFile.text.trim()
            if (!(base ==~ /^[0-9]+\.[0-9]+\.[0-9]+([-+].*)?$/)) {
                throw new GradleException("invalid semver in ${versionFile}: ${base}")
            }
            releaseVersionName = variant.name.toLowerCase().contains("alpha")
                    ? "${base}-alpha.${utcTimestamp()}"
                    : base
        }
        variant.outputs.forEach { output ->
            output.versionCode.set(releaseVersionCode)
            output.versionName.set(releaseVersionName)
        }
    }
}

